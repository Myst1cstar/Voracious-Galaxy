 # Diplomacy text
 ####################################
 
 
 # Vore Warriors
 VD_HOSTILE_GREETING_01:0 "Speak quickly prey, or you'll leave this room in my stomach."
 VD_HOSTILE_GREETING_02:0 "Have you ever thought about how it might feel to get eaten? You and the rest of the [From.GetSpeciesNamePlural] will know soon enough."
 VD_HOSTILE_GREETING_03:0 "It's a wonder you [From.GetSpeciesNamePlural] ever made spaceflight, but we're glad you did. The [Root.GetSpeciesName] would be sad to miss out on such tasty snacks."
 VD_HOSTILE_GREETING_04:0 "The galaxy will know who the apex predators are once the [From.GetSpeciesName] are bellyfat."
 VD_HOSTILE_GREETING_05:0 "The [From.GetSpeciesName] are so delicious, we'll surely be having a taste soon enough... willing or not."
 VD_HOSTILE_GREETING_06:0 "Have you come to beg for a stay in my stomach?"
 VD_HOSTILE_GREETING_07:0 "You should know that you [From.GetSpeciesNamePlural] are a real delicacy, our people are eager to get more..."
 VD_HOSTILE_GREETING_08:0 "You should know that some cattle tried to escape back to [From.GetName]. I had the privilege of eating one of them myself, they were quite tasty."
 VD_HOSTILE_GREETING_08:0 "Unless you are here to discuss how to best prepare your pitiful empire for our dominion, leave."
 VD_HOSTILE_GREETING_09:0 "I hope you know I eagerly await the day you slide down my gullet."
 
 VD_DOMINEERING_GREETING_01:0 "Why continue this farce? You'll be very content to your place in [Root.GetSpeciesName] society."
 VD_DOMINEERING_GREETING_02:0 "You should submit to your betters already, this pretending at independence shames the [From.GetSpeciesName]."
 VD_DOMINEERING_GREETING_03:0 "Have you finally come to realize your place in the galaxy?"
 VD_DOMINEERING_GREETING_04:0 "Wouldn't you rather live in comfort under the [Root.GetSpeciesName] than get enslaved by some tyrannical despot?"
 
 VD_NEUTRAL_GREETING_01:0 "So long as you steer clear of hunting grounds, you may do as you please."
 VD_NEUTRAL_GREETING_02:0 "The [Root.GetSpeciesName] have yet to decide on whether or not you are prey, so enjoy this this time of peace while you can."
 VD_NEUTRAL_GREETING_03:0 "While I know not to eat the foreign emissaries, not all of my personnel have the same self-control."
 VD_NEUTRAL_GREETING_04:0 "You look quite tasty... If only you weren't so important to the [From.GetSpeciesName] I'd eat you up right here."
 VD_NEUTRAL_GREETING_05:0 "*Urrp!* Oh, sorry, just finished taking care of an annoying secretary. Now, what did you want to talk about?"
 VD_NEUTRAL_GREETING_06:0 "Our scientists have theorized that getting eaten by a [Root.GetSpeciesName] would be quite pleasurable for a [FROM.GetSpeciesName]."
 VD_NEUTRAL_GREETING_07:0 "You shouldn't visit here so often, my stomach is always growling by the time we're done and next time I might not wait till after the meeting to get a snack..."
 VD_NEUTRAL_GREETING_08:0 "I'm told the [From.GetSpeciesName] have a taste unlike anything found [Root.Capital.GetName]..."
 VD_NEUTRAL_GREETING_09:0 "Make this quick, the [Root.GetSpeciesName] have hunting to do."
 
 VD_THREATENED_GREETING_01:0 "You will not make meals out of our predators, [From.GetSpeciesName]!"
 VD_THREATENED_GREETING_02:0 "Blind luck and flukes will only carry you so far, [From.GetSpeciesName]. You will will our bellies one day too."
 VD_THREATENED_GREETING_03:0 "You may be on top now but time will show the [Root.GetSpeciesName] are the galaxy's apex predators - you are nothing but prey!"
 
 VD_FRIENDLY_GREETING_01:0 "Ah, my favorite snack returns! Just kidding, I won't eat you... yet."
 VD_FRIENDLY_GREETING_02:0 "Our alliance has opened many new hunting grounds for us and for that, we thank you."
 VD_FRIENDLY_GREETING_03:0 "Sorry about the attendant you lost on your last visit, I have personally eaten the [Root.GetSpeciesName] responsible."
 VD_FRIENDLY_GREETING_04:0 "The [Root.GetSpeciesName] people are glad to know there are other worthy hunters among the stars."
 VD_FRIENDLY_GREETING_05:0 "Some [Root.GetSpeciesName] wonder if the [From.GetSpeciesName] have considered becoming apex hunters like ourselves?"
 VD_FRIENDLY_GREETING_06:0 "[Root.GetRulerTitle] [Root.GetRulerName] has decreed that the [from.GetSpeciesName] are to be exempt from being targets of our hunters. We hope you appreciate this declaration of friendship."
 
 VD_WAR_GREETING_01:0 "Your warriors are being devoured even as we speak, it will be not be long now..."
 VD_WAR_GREETING_02:0 "[Root.GetRulerTitle] [Root.GetRulerName] has marked you as my prey, I look forward having you round out these curves!"
 VD_WAR_GREETING_03:0 "This war was decided before it began. We are the hunters, you are the prey, and you will be consumed."
 VD_WAR_GREETING_04:0 "Our warriors are getting fat off the sacrifices of your people."
 VD_WAR_GREETING_05:0 "Whether it's on the battlefield or off it, the [From.GetSpeciesName] are destined for [Root.GetSpeciesName] bellies."
 VD_WAR_GREETING_08:0 "Bring as many troops as you like, we'll eat them all and still have room for seconds."
 VD_WAR_GREETING_06:0 "I've been told that [Root.GetRulerTitle] [Root.GetRulerName] plans to eat [From.GetRulerTitle] [From.GetRulerName] personally, with the whole empire watching!"
 VD_WAR_GREETING_07:0 "Our hunters really appreciate the chance to hone their skills. You will be a valuable stepping stone on our path to galactic domination."
 
 # Vassal greetings
 VD_VASSAL_GREETING_01:0 "[Root.GetRulerTitle] [Root.GetRulerName] has acknowledged you as our superiors, we hope to go on many great hunts with our masters."
 VD_VASSAL_GREETING_02:0 "[Root.GetRulerTitle] [Root.GetRulerName] wishes you many successful hunts, and many delicious meals."
 VD_VASSAL_GREETING_03:0 "[Root.GetSpeciesName] bellies will be filled with the enemies of your empire. You will find us the greatest hunters in the galaxy."
 VD_VASSAL_GREETING_DISLOYAL_01:0 "The [Root.GetSpeciesName] will not suffer this shame for long..."
 VD_VASSAL_GREETING_DISLOYAL_02:0 "When we break these chains, we will devour you. [Root.GetRulerTitle] [Root.GetRulerName] will enjoy [From.GetRulerTitle] [From.GetRulerName] sliding into [ROOT.ruler.GetHerHis] stomach."
 VD_VASSAL_GREETING_DISLOYAL_03:0 "We will stop eating your ambassadors when you release us from these chains. And then will will eat your entire race."
 
 # Declaration of War
 VD_DOW_PROPOSE_01:0 "Pitiful prey, you will consumed by the might of the [Root.GetSpeciesName]!"
 
 VD_OVERLORD_GREETING_01:0 "What do you want, food? Are you here to fill [Root.GetRulerTitle] [Root.GetRulerName]'s belly?"
 VD_OVERLORD_GREETING_02:0 "Ah, [From.GetSpeciesName]! What do you need from your overlord, delicious?"
 VD_OVERLORD_GREETING_03:0 "You should feel honoured, [From.GetSpeciesName], your kind have become the favourite species in the galaxy to fill [Root.GetSpeciesName] bellies."

 # Motherly_Matriarchs
 UB_HOSTILE_GREETING_01:0 "You hurt everyone around you with your foolish actions, the [Root.GetSpeciesNamePlural] will have nothing to do with you."
 UB_HOSTILE_GREETING_02:0 "All the [From.GetSpeciesName] should be snuggled up in [Root.GetRulerTitle] [Root.GetRulerName]'s womb and converted to [Root.GetSpeciesName]! The galaxy would be better for it."
 UB_HOSTILE_GREETING_03:0 "Your poor attitudes are a dissappointment to the [Root.GetSpeciesName]."
 UB_HOSTILE_GREETING_04:0 "We might've been able to coexsist if not for the poor judgement of [From.GetRulerName]."
 UB_HOSTILE_GREETING_05:0 "Despite your past transgressions, we still hold out hope that the [From.GetSpeciesName] can be taught how to live peacefully with their Xeno neighbors."
 UB_HOSTILE_GREETING_06:0 "We simply wish to live peaceful lives, why must you bother us so?"
 UB_HOSTILE_GREETING_07:0 "I don't suppose [Root.GetRulerTitle] [Root.GetRulerName] would care for a stay in my womb? They might come to see things our way then..."
 UB_HOSTILE_GREETING_08:0 "[From.GetRulerTitle] [From.GetRulerName] has established a sanctuary for [From.GetSpeciesName] eager to escape [Root.GetRulerTitle] [Root.GetRulerName]'s foolish rule."
 UB_HOSTILE_GREETING_08:0 "The wombs of our diplomats are wet and ready to convince you the errors of your ways."
 UB_HOSTILE_GREETING_09:0 "Although [From.GetRulerTitle] [From.GetRulerName] has proven themselves irredeemable, we still hold out hope for the rest of your species."
 
 UB_DOMINEERING_GREETING_01:0 "You seem very innocent and naive. Perhaps you need our guidance..."
 UB_DOMINEERING_GREETING_02:0 "It's dangerous to go it alone in the galaxy, you'd be much safer under our protection"
 UB_DOMINEERING_GREETING_03:0 "The [From.GetSpeciesName] have strayed from the path, but we believe their is still hope."
 UB_DOMINEERING_GREETING_04:0 "Can't you see that you're unable to care for yourselves? You'll be much happier under the rule of [Root.GetRulerTitle] [Root.GetRulerName]."
 
 UB_NEUTRAL_GREETING_01:0 "Hello, have you come to seek our wisdom?"
 UB_NEUTRAL_GREETING_02:0 "You look pretty cute, but I bet you'd be better as a [Root.GetSpeciesName]!"
 UB_NEUTRAL_GREETING_03:0 "If you wish to spend some time in my womb, you need only ask. Don't stay too long though or you may not make it out again..."
 UB_NEUTRAL_GREETING_04:0 "I've never had a [From.GetSpeciesName] in my womb before, I wonder how it would feel..."
 UB_NEUTRAL_GREETING_05:0 "Don't mind the belly bulge, she was just proposing some rather radical ideas."
 UB_NEUTRAL_GREETING_06:0 "Oh, hello! I'm a new diplomat but I unbirthed the last one so I have all her knowledge! Everything should be go smoothly from here on out."
 UB_NEUTRAL_GREETING_07:0 "I can't imagine living life without a full womb, xenos are so strange."
 UB_NEUTRAL_GREETING_08:0 "[From.GetRulerTitle] [From.GetRulerName] is always looking to build up better relations with Xenos."
 UB_NEUTRAL_GREETING_09:0 "Are you curious about the [Root.GetSpeciesName] unbirthing technique? Apparently it's a rare trait among Xenos."
 
 UB_THREATENED_GREETING_01:0 "Depriving the galaxy of our guidance is a greater crime than anything else you have done!"
 UB_THREATENED_GREETING_02:0 "Many will weep for the death of the [Root.GetSpeciesName] but they will celebrate your end."
 UB_THREATENED_GREETING_03:0 "Have you come to take more from the innocent [Root.GetSpeciesName]?"
 
 UB_FRIENDLY_GREETING_01:0 "I would happily accept you into my womb friend. Your knowledge would make both our empires stronger."
 UB_FRIENDLY_GREETING_02:0 "Together we can protect and guide the helpless xenos of the galaxy."
 UB_FRIENDLY_GREETING_03:0 "We are happy to provide our guidance to such good friends of the [Root.GetSpeciesName]."
 UB_FRIENDLY_GREETING_04:0 "Our scientists say the [From.GetSpeciesName] would become [Root.GetSpeciesName] after being unbirthed. If you ever want to make the switch, you know where to find me."
 UB_FRIENDLY_GREETING_05:0 "I just gave birth recently so my womb is ready for another occupant if you'd like..."
 UB_FRIENDLY_GREETING_06:0 "See my belly? A [From.GetSpeciesName] actually asked to get unbirthed! I'm so excited!"
 
 UB_WAR_GREETING_01:0 "We do not like fighting, but don't think that means we'll wait to be conquered."
 UB_WAR_GREETING_02:0 "The [Root.GetSpeciesName] are saddened by every death in this war that you continue to wage."
 UB_WAR_GREETING_03:0 "The [Root.GetSpeciesName] know to catch and unbirth your soldiers whenever possible, they will have much more pleasent lives in our empire than they could ever have had in yours."
 UB_WAR_GREETING_04:0 "We hold no malice against the [From.GetSpeciesName] for the actions of [From.GetRulerTitle] [From.GetRulerName]. After you are defeated, they will be treated as equals in the empire."
 UB_WAR_GREETING_05:0 "Our soldiers learn more of your tactics with every foe they unbirth. You cannot hope to stand against us for long."
 UB_WAR_GREETING_08:0 "The galaxy will be a much safer place once the [From.GetSpeciesName] threat has been defeated."
 UB_WAR_GREETING_06:0 "We fight for survival, and you fight for greed. That is why you will fail."
 UB_WAR_GREETING_07:0 "Once this war is over, you'll be squirming in my womb just like every other misguided leader in your empire."
 
 # Vassal greetings
 UB_VASSAL_GREETING_01:0 "We hope you will continue to protect and guide the weak, as we have done."
 UB_VASSAL_GREETING_DISLOYAL_01:0 "The suffering you have inflicted upon the [Root.GetSpeciesName] has only postponed your inevitable demise."
 
 # Declaration of War
 UB_DOW_PROPOSE_01:0 "If you can not take care of your selves, we will bear that responsibility..."
 
 UB_OVERLORD_GREETING_01:0 "Yes young one, do you have something for me?"

   # Peaceful_Prey
 PY_HOSTILE_GREETING_01:0 "The [Root.GetSpeciesName] have no interest in cooperating with your kind."
 PY_HOSTILE_GREETING_02:0 "We [Root.GetSpeciesName] have spent our entire exsistence being hunted, and we have yet to fall. We will survive this too."
 PY_HOSTILE_GREETING_03:0 "It's a shame we couldn't befriend the [From.GetSpeciesName], we always treat violence as a last resort."
 PY_HOSTILE_GREETING_04:0 "The [Root.GetSpeciesName] will not be pushed around by the likes of you."
 PY_HOSTILE_GREETING_05:0 "Ah, our least favorite xenos have come to visit once more..."
 PY_HOSTILE_GREETING_06:0 "The creation of the [From.GetSpeciesName] was a cruel joke to play on the galaxy."
 PY_HOSTILE_GREETING_07:0 "Come to spout more of [Root.GetRulerTitle] [Root.GetRulerName]'s lies? Thank you, but we've had our fill."
 PY_HOSTILE_GREETING_08:0 "The time for talking is over, unless of course you've come to apologize for your transgressions."
 PY_HOSTILE_GREETING_08:0 "Your greed knows no bounds, but your dominion will if we have anything to say about it."
 PY_HOSTILE_GREETING_09:0 "So the [From.GetSpeciesName] think they have cornered their prey? Good..."
 
 PY_DOMINEERING_GREETING_01:0 "It looks like we'll get our turn as the predators soon..."
 PY_DOMINEERING_GREETING_02:0 "If you're too weak to defend yourself from us, of all things, then you really have no cause to complain when we add your strength to ours."
 PY_DOMINEERING_GREETING_03:0 "You should consider yourself lucky to be put under our protection, others might just eat you outright."
 PY_DOMINEERING_GREETING_04:0 "This will lead to a better future for both our peoples."
 
 PY_NEUTRAL_GREETING_01:0 "It's always a pleasure to interact with new cultures."
 PY_NEUTRAL_GREETING_02:0 "The [From.GetSpeciesName] form is truly a delight to the eyes."
 PY_NEUTRAL_GREETING_03:0 "The [Root.GetSpeciesName] hope this to be the start of a great friendship between our people."
 PY_NEUTRAL_GREETING_04:0 "Our traders our eager find new markets among the [From.GetSpeciesName]."
 PY_NEUTRAL_GREETING_05:0 "There are rumors that some xenos can actually eat others whole! You don't think that's true... Right?"
 PY_NEUTRAL_GREETING_06:0 "[Root.GetRulerTitle] [Root.GetRulerName] has expressed in interest in meeting [From.GetRulerTitle] [From.GetRulerName] to better understand xeno culture."
 PY_NEUTRAL_GREETING_07:0 "We hope to one day stand united against the foes of galactic peace."
 PY_NEUTRAL_GREETING_08:0 "You can trust the [Root.GetSpeciesName] to be [Root.GetAdj] of their word."
 PY_NEUTRAL_GREETING_09:0 "The sooner we decide to work together, the sooner we can build a better future for both our people."
 
 PY_THREATENED_GREETING_01:0 "What have we done to draw the ire of the [From.GetSpeciesName]?"
 PY_THREATENED_GREETING_02:0 "Fight us if you must, but know we will not be quietly herded into slavery."
 PY_THREATENED_GREETING_03:0 "The [Root.GetSpeciesName] have spent their whole history being hunted, it appears the age of spaceflight will be no different..."
 
 PY_FRIENDLY_GREETING_01:0 "Your people are always welcome among the [Root.GetSpeciesName]."
 PY_FRIENDLY_GREETING_02:0 "We're glad to see [From.GetRulerTitle] [From.GetRulerName] has the  desire for a better galaxy at heart."
 PY_FRIENDLY_GREETING_03:0 "Just off the record, I wouldn't mind being eaten by you..."
 PY_FRIENDLY_GREETING_04:0 "We are glad to have found such good friends among the stars."
 PY_FRIENDLY_GREETING_05:0 "A more perfect world is within reach now that we can work at it together."
 PY_FRIENDLY_GREETING_06:0 "You should know [From.GetSpeciesName] culture is very popular among the [Root.GetSpeciesName]."
 
 PY_WAR_GREETING_01:0 "The persucutions of the [From.GetSpeciesName] stop here."
 PY_WAR_GREETING_02:0 "[Root.GetRulerTitle] [Root.GetRulerName] will never let the [Root.GetSpeciesNamePlural] fall into your incompetent hands."
 PY_WAR_GREETING_03:0 "Our people stands united in their resistance to your misguided regime."
 PY_WAR_GREETING_04:0 "The evil that xenos do lives on and on, throughout history."
 PY_WAR_GREETING_05:0 "This slaughter of the innocent has surely gone on long enough?"
 PY_WAR_GREETING_06:0 "The [From.GetSpeciesName] will soon be free of the yoke of [From.GetRulerTitle] [From.GetRulerName]."
 PY_WAR_GREETING_07:0 "What we lack in physical strength, we make up for in guile."
 PY_WAR_GREETING_08:0 "This conflict may sow seeds of mistrust between the [Root.GetSpeciesNamePlural] and the [From.GetSpeciesNamePlural] for generations. What could possibly be worth that loss?"
 
 # Vassal greetings
 PY_VASSAL_GREETING_01:0 "We hope to learn much uner the guidance of [From.GetRulerTitle] [From.GetRulerName]."
 PY_VASSAL_GREETING_DISLOYAL_01:0 "We may serve you now, but the time will come when the [Root.GetSpeciesName] will have suffered too much."
 
 # Declaration of War
 PY_DOW_PROPOSE_01:0 "War should always be a last resort. But if you will not accept reason then we are left with no choice."
 
 PY_OVERLORD_GREETING_01:0 "Do the [From.GetSpeciesName] require something of us?"
 

