 ##########
 civic_vore_darwinism: "Vore-based Darwinism"
 civic_vore_darwinism_desc: "This society believes in their destiny as the apex predators of the galaxy, always seeking to expand their herds of livestock."
 civic_tooltip_vore_darwinism_effects: "Grants powerful combat bonuses however the competitve nature of this society gives it higher mortality rates and is less desirable for immigrants. \n§Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! increased by §G15%§!\n§Y$MOD_SHIP_FIRE_RATE_MULT$§! increased by §G15%§!\n§Y$MOD_ARMY_DAMAGE_MULT$§! increased by §G15%§!\n§YLeader experience gain§! increased by §G25%§!\n§Y$MOD_LEADER_SKILL_LEVELS$§! increased by §G2§!\n§Y$MOD_COUNTRY_IMMIGRATION_PULL_MULT$§! decreased by §R-25%§!\n§Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! decreased by §R-10§!\n§Y$MOD_POP_GROWTH_SPEED$§! decreased by §R-10%§!"
 #civic_vore_strength: "Rule Through Strength"
 #civic_vore_strength_desc: "This society is dominated by the strongest predators, with people attaining rank and status by eating the competition, with the most powerful predator ruling the empire until a more powerful predator comes along."
 #civic_tooltip_vore_strength_effects: "This society's leaders can gain powerful traits by improving their vore ability, but are always at risk of being eaten by their rivals or underlings."
 civic_unbirth_absorption: "Unbirth absorption"
 civic_unbirth_absorption_desc: "This species uses its unbirthing ability to drain the experience and knowledge from their victims, who are reverted to an infantile state of the 'mother' species. \n§YLeader experience gain§! increased by §G25%§!\n§Y$MOD_LEADER_SKILL_LEVELS$§! increased by §G2§!\n§YUnity§! increased by §G15%§!\n§Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! increased by §G15%§!"
 civic_tooltip_unbirth_absorption_effects: "Leaders grow much more quickly and can reach higher levels of proficiency by absorbing the knowledge of their peers." 
 civic_utopian_prey: "Utopian Prey"
 civic_utopian_prey_desc: "This society did away with petty squabbles early in their history, and as such is well behind other spacefaring civilizations in the art of waging war. Those who would take this as a sign of weakness, however, will find that their unified identity inspires them to fight with an unmatched ferocity against invaders.\n§Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! decreased by §R-20%§!\n§Y$MOD_SHIP_FIRE_RATE_MULT$§! decreased by §R-10%§!\n§Y$MOD_SHIP_HOME_TERRITORY_FIRE_RATE_MULT$§! increased by §G30%§!\n§YLeader experience gain§! decreased by §R-15%§!\n §YUnity§! increased by §G25%§!\n§Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! increased by §G15%§!"
 civic_tooltip_utopian_prey_effects: "Trade away combat bonuses in favor of strong unity and governing ethics bonuses."
 civic_voredeity: "Divine Predator"
 civic_voredeity_desc: "This species is ruled by an immortal predator revered as a deity, who grows in power by devouring the most powerful, intelligent and beautiful members of their society."
 civic_tooltip_voredeity_effects: "This species' ruler gains the Divine Predator trait, making them immortal and conferring many bonuses on their civilization, in exchange for a §R-10%§! penalty to their empire's population growth speed, and greater friction with neighboring empires."

