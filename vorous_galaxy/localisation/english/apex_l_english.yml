 trait_scientist_apprentice_predator: "Apprentice Predator"
 trait_scientist_apprentice_predator_desc: "§LThis leader was lucky enough to survive their first few encounters with power-hungry predators.§!\n"
 trait_scientist_adept_predator: "Adept Predator"
