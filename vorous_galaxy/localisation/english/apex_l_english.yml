 trait_ruler_voredeity: "Divine Predator"
 trait_ruler_voredeity_desc: "§LThis ruler is a predator of an entirely different caliber, having achieved immortality through the many individuals they have devoured and absorbed, and revered by their people as a manifestation of the divine. Their word is law within their borders, but other civilizations find the fanatical devotion they enjoy threatening.§!\n"

 #Governor traits
 trait_governor_novice_predator: "Novice Predator"
