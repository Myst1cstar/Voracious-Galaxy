 trait_scientist_expert_predator: "Expert Predator"
 trait_scientist_expert_predator_desc: "§LThe struggle against others competing for their position has left this leader with lots of experience§!\n"
 trait_scientist_master_predator: "Master Predator"
 trait_scientist_master_predator_desc: "§LThis leader is a peak specimen of their species, and their skills reflect that§!\n"

 #Admiral traits
