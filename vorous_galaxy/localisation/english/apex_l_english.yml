 # Vore Events #
 ###############

 unbirther.2.name: "Rebirth Ceremony on [Root.Capital.GetName]"
 unbirther.2.desc: "Ever since the [Root.GetAdj] takeover of [Root.Capital.GetName], the transformation of [unbirth_species.GetNamePlural] into [Root.GetSpeciesNamePlural] has been shrouded in ritual. Once every ten years - a date which is rapidly approaching - the "Natophytes" gather in the Chamber of Rebirth for a special ceremony. What exactly happens to them is a closely-guarded secret known only to a select few, but when they emerge, they do so as [Root.GetSpeciesNamePlural]."
 unbirther.2.A: "Let the preparations commence!"
 unbirther.2.A.tooltip: "At the end of the year, all §H$job_unbirth_apprentice_plural$§! on §H[Root.Capital.GetName]§! will be converted into §H[Root.GetSpeciesNamePlural]§!.\n\nThis ceremony will take place every §H10 years§! on each [Root.GetAdj] planet with a §HChamber of Rebirth§!."
 MESSAGE_UNBIRTH_POPS_UNBIRTHED_TITLE: "Pops Unbirthed"
 MESSAGE_UNBIRTH_POPS_UNBIRTHED: "We have converted $VALUE|Y$ £pops£ Pops to our species in a Rebirth Ceremony on $PLANET|Y$."

 vore.2.title: "Voracious [vore_species.GetAdj] Frenzy on [Root.GetName]!"
 vore.2.desc: "Predatory [vore_species.GetNamePlural] on [Root.GetName] have gone into a voracious frenzy, causing chaos in settlements as they indiscriminately devour members of the planet's [prey_species.GetName] population! Our intelligence officers predict the initial frenzy will abate soon, but the planet's [vore_species.GetNamePlural] are sure to continue casually devouring [prey_species.GetNamePlural] for some time to come."
 vore.2.c: "No better than beasts. Put them down."
 vore.2.d: "Surely if we can just talk things out with them..."

 vore.6.title: "Rogue Predators on [Root.GetName]!"
 vore.6.desc: "[Root.GetName] is currently experiencing a surge in criminal activity among certain vore-capable populations. While their devouring of the planet's more upstanding citizens isn't projected to cause any long-term damage, their hedonistic indulgence using their prey's former assets is expected to cause significant disruption to the civilian economy for the near future."

 #################
 # ENVOY EVENTS
 #################

 vore.3.name: "Predatory [envoy_source.GetSpeciesAdj] Envoy"
 vore.3.desc: "Our diplomats have discovered that [event_envoy.GetName], the [envoy_source.GetSpeciesAdj] envoy to [Root.Capital.GetName], has been eating several individuals! Our local officials working with [event_envoy.GetName] walked in on the [event_envoy.GetSpeciesName] mid-meal, with one of our worker's very clearly sliding down their gullet. Although [event_envoy.GetName] did apologise to our staff for the shocking scene, [event_envoy.GetHerHim] unfortunate meal was very much digested, and now contributes greatly to [event_envoy.GetName]'s assets."
 vore.3.A: "Unacceptable! We deserve compensation for our digested staff!"
 vore.3.B: "[event_envoy.GetFirstName] is a fine predator. [event_envoy.GetSheHeCap] deserves [event_envoy.GetHerHis] meal!"

 vore.4.name: "Predatory Envoy"
 vore.4.desc.base: "Our envoy to the [From.GetSpeciesName], [event_envoy.GetName], has been discovered eating local [From.GetSpeciesNamePlural] during [event_envoy.GetHerHis] free time. [From.GetSpeciesName] diplomats working with [event_envoy.GetFirstName] happened to walk in on [event_envoy.GetHerHim] mid-meal with a [From.GetSpeciesName] sliding down [event_envoy.GetHerHis] gullet! Although [event_envoy.GetFirstName] did apologise to their staff for the shocking scene, [event_envoy.GetHerHis] unfortunate meal was very much digested, and now contributes greatly to [event_envoy.GetFirstName]'s assets."
 vore.4.desc.pos: "$vore.4.desc.base$\n\nDespite the digestion of one of their own by [event_envoy.GetName] the [From.GetSpeciesNamePlural] appear to have taken the incident well. We've received a lot of compliments regarding the voracious skills of [event_envoy.GetFirstName], despite the [From.GetSpeciesNamePlural] fattening [event_envoy.GetHerHis] assets."
 vore.4.desc.neg: "$vore.4.desc.base$\n\nThe [From.GetSpeciesNamePlural] are rather upset at this incident, with many demanding an apology from [event_envoy.GetName] for digesting one of them. That [event_envoy.GetFirstName] has supposedly been doing this for some time has become poorly-digested news - unlike their now well-digested people fattening [event_envoy.GetFirstName]'s assets."
 vore.4.B: "Did they taste good?"
 
 opinion_envoy_predator_offence: "Predatory Envoy"
 opinion_envoy_predator_respect: "Predatory Respect"
