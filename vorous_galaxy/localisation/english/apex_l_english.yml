 trait_governor_master_predator: "Master Predator"
 trait_governor_master_predator_desc: "§LFew are even willing to attempt eating this experienced predator, as most would be a free meal for this leader§!\n"
 trait_governor_prey: "Prey"
 trait_governor_prey_desc: "§LThis leader harbors fantasies of being prey.§!\n"

 #Scientist traits
 trait_scientist_prey: "Prey"
