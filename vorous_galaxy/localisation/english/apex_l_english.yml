 building_unbirth_chamber_of_rebirth_desc: "Those awaiting unbirthing spend their days being pampered and pleased motherly [This.Owner.GetSpeciesNamePlural] in the comfort of the Chamber of Rebirth."
 building_unbirth_temple_of_motherhood: "Temple of Motherhood"
 building_unbirth_temple_of_motherhood_desc: "A glorious temple of hedonism and fecundity where lesser species await their inevitable rebirth as [This.Owner.GetSpeciesNamePlural]."

