 trait_governor_apprentice_predator: "Apprentice Predator"
 trait_governor_apprentice_predator_desc: "§LThis leader has managed to gain some familiarity with eating others.§!\n"
 trait_governor_adept_predator: "Adept Predator"
 trait_governor_adept_predator_desc: "§LThis leader has a degree of familiarity with eating others, suriving this long has started to show in their abilities§!\n"
 trait_governor_expert_predator: "Expert Predator"
