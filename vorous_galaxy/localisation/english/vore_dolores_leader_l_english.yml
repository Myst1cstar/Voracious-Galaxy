l_english:

 ###################################
 #   DOLORES RANDOM LEADER EVENTS
 ###################################

 # voragons.200 — Priority Target
 voragons.200.name: "One of Her Favourites"
 voragons.200.desc: "Dolores has submitted an unusual internal memo. Under the heading §H'My Dear Ones (A Running List)'§! — a section that, we feel, did not need to exist — she has written at length and with enormous affection about one of your senior personnel.\n\n§L'I simply §Iadore§L this one,'§! the memo reads. §L'So clever, so kind to the junior staff, works far too hard. I worry about them constantly. I want to keep them close — somewhere warm, somewhere safe, somewhere I can always feel that they're alright.'§!\n\nThe memo includes a proposed schedule, a note about the staff member's favourite tea, and a closing line that has caused the entire HR department to go very quiet: §L'I think it's time. I love them too much to leave them out there where the cold can get them.'§!"
 voragons.200.a: "Post a guard and warn them immediately."
 voragons.200.a.tooltip: "The staff member is informed, escorted to a secure wing, and gently told to vary their routine. Dolores sends a sad little note: §L'You're keeping them from me. I only want them to be safe.'§! §R-75 Influence§!."
 voragons.200.b: "She does love them. Let her keep them close."
 voragons.200.b.tooltip: "Dolores collects her dear one personally, with great tenderness. They are consumed. She is, for days afterward, visibly and serenely happy — humming, doting on everyone else, one hand always resting fondly over her middle. §R[One leader consumed]§!. §Y+800 Society Research§!. Hunger resets."
 voragons.200.c: "Dolores. You cannot keep people like keepsakes."
 voragons.200.c.tooltip: "Dolores withdraws the memo with what HR describes as 'heartbroken reluctance.' The staff member never learns how loved they were. Dolores does not entirely let the matter go. §R-150 Unity§!."

 # voragons.201 — Post-Breakfast Correspondence
 voragons.201.name: "Post-Breakfast Correspondence"
 voragons.201.desc: "A research team lead has gone missing from the laboratory wing. Security footage shows them excitedly explaining their latest findings to Dolores at approximately 0800 hours — and shows Dolores listening the way a proud mother listens, chin in her hands, beaming. The footage ends at 0801.\n\nAt 0802, Dolores is seen at the adjacent terminal, carefully writing up the scientist's unfinished work so that none of it would be lost, one hand resting contentedly over her middle. The report contains several breakthroughs the scientist had not yet committed to paper.\n\n§L'She was so proud of this work,'§! Dolores wrote in the margin, in a gentler hand than the rest. §L'I couldn't bear for it to be forgotten. She's safe with me now — and so are all her clever ideas. I'll see them finished for her. That's what a mother does.'§!"
 voragons.201.a: "File it under research contributions. Somehow."
 voragons.201.a.tooltip: "The scientist's final findings are recovered and catalogued. The manner of their extraction is not mentioned in the official report. §Y+1000 Physics Research§!, §Y+1000 Society Research§!."
 voragons.201.b: "This is completely unacceptable. Implement access controls."
 voragons.201.b.tooltip: "A formal reprimand is issued. Restricted access zones are established around the research wing. Dolores describes the new signage as §L'charming.'§! §R-200 Unity§!, §Y+500 Physics Research§! (the notes, at least, are salvaged)."

 # voragons.202 — A Helpful Suggestion
 voragons.202.name: "A Helpful Suggestion"
 voragons.202.desc: "Dolores has flagged a concern about one of your fleet commanders — not, this time, with fondness. Her memo is precise and quietly furious. The commander, she notes, has been sending green crews into engagements they cannot survive, falsifying the casualty reports, and drinking through the watch.\n\n§L'They are getting my children killed,'§! she writes, and the temperature of the sentence is several degrees below the rest. §L'Your soldiers are §Imine§L to protect, and this one is feeding them to the dark to cover his own failures. I would like to have a word with him. Privately. I have Tuesdays free.'§!\n\nThe commander, shown the memo, has begun taking all meals at his desk and has filed three transfer requests."
 voragons.202.a: "She protects her own. Tuesday works."
 voragons.202.a.tooltip: "Dolores collects the commander personally. He is gone. The crews he was killing live to see another posting, under someone who will look after them. Dolores is calm and satisfied — a threat to her family, removed. §R[One commander consumed]§!. §Y+800 Alloys§!, §Y+1000 Engineering Research§!. Hunger resets."
 voragons.202.b: "Stand down. The chain of command will handle this."
 voragons.202.b.tooltip: "Dolores accepts the decision with what could generously be described as grace. She reschedules Tuesday for something else. §R-100 Influence§!."
 voragons.202.c: "We appreciate the initiative. Please redirect it elsewhere."
 voragons.202.c.tooltip: "A diplomatic non-answer. Dolores files it as 'deferred.' The commander has started running drills. §R-100 Unity§!, §R-50 Influence§!."

 # voragons.203 — Tuesday
 voragons.203.name: "Tuesday"
 voragons.203.desc: "Security has logged an incident. The description field reads:\n\n§L'Dolores. Same as last time. See attached.'§!\n\nThere is no attachment.\n\nThe weekly staffing report shows one fewer name on the manifest. No formal complaint has been filed. The surviving administrative staff have chosen, as a collective, simply not to think about it very hard. The break room has a new sign. It says §R'OCCUPIED — DO NOT ENTER'§! and has a small picture of Dolores that someone has drawn with surprising artistic skill."
 voragons.203.a: "Noted. Moving on."
 voragons.203.a.tooltip: "The incident is filed, the form is signed, and everyone agrees not to make it A Thing. §R-50 Unity§!."
 voragons.203.b: "Post additional safety notices. Update the restricted zones."
 voragons.203.b.tooltip: "New signage is installed. New zones are designated. Dolores reads the new map with what looks like mild amusement. §R-150 Unity§!. Future incident chance reduced for 540 days."

 # voragons.204 — Record Time
 voragons.204.name: "Record Time"
 voragons.204.desc: "One of your senior staff set what the athletics department is calling an unofficial facility speed record this morning, sprinting eleven corridors in forty-three seconds and locking themselves in a supply closet with commendable efficiency.\n\nThey have declined to explain what they were running from, stating only that they are §L'fine,'§! §L'absolutely fine,'§! and would like §L'a desk somewhere Mother can't reach, please, please, thank you.'§!\n\nDolores, when asked for comment, pressed both hands to her cheeks and positively §Iglowed§!: §L'Oh, isn't that one a §Idelight§L? So full of life! So much fight in them! That's exactly the spirit I want to keep safe forever.'§!\n\nShe added, warmly, that she was in no hurry at all. §L'They'll come to me on their own one day. They always do, once they understand how much I love them.'§!"
 voragons.204.a: "Congratulate them on the achievement."
 voragons.204.a.tooltip: "The staff member receives a commendation for exceptional reflexes. Morale across the complex improves — it turns out people find it reassuring that escape is theoretically possible. §Y+200 Unity§!."
 voragons.204.b: "Ask Dolores to write up a debrief on what went wrong."
 voragons.204.b.tooltip: "Dolores submits a thorough after-action report on prey evasion mechanics, recommended countermeasures, and optimal corridor lighting conditions. It is horrifying and scientifically useful. §Y+600 Society Research§!, §Y+600 Engineering Research§!."
 voragons.204.c: "Suggest Dolores recalibrate her approach for next time."
 voragons.204.c.tooltip: "A diplomatic non-confrontational coaching session. Dolores takes notes. The staff member is issued a commendation and a faster keycard. §Y+100 Unity§!, §Y+50 Influence§!."

 # voragons.205 — The Midnight Snack
 voragons.205.name: "The Midnight Snack"
 voragons.205.desc: "Security has flagged an anomaly in the overnight logs.\n\nAt 0312 hours, a night-shift intern — alone, exhausted, far from home — entered the break room. At 0313, the door closed. At 0318, Dolores is observed exiting, significantly more §Lrotund§! than when she entered, humming a lullaby under her breath.\n\nShe has filed a note, in the soft hand she uses for the things she means: §L'The poor little thing was working themselves sick, all alone at this hour, no one to tuck them in. Well. They're not alone anymore. They're warm now, and safe, and they'll never have to do a graveyard shift again. Sleep tight, sweetheart.'§!\n\nDolores is currently asleep at her desk, hands folded over an extremely distended midsection, looking profoundly, maternally at peace."
 voragons.205.a: "Log it in the overnight incident report."
 voragons.205.a.tooltip: "The form is completed, the box is ticked, the chair is quietly replaced. We do not look at the camera footage more than once. §R-75 Unity§!."
 voragons.205.b: "Install monitoring equipment in all common areas."
 voragons.205.b.tooltip: "Motion sensors, full camera coverage, and a new sign reading §H'THIS AREA IS MONITORED.'§! Dolores reads the sign, tilts her head, and says §L'charming.'§! §R-200 Unity§!. Incident risk reduced for 540 days."
 voragons.205.c: "She does seem exceptionally focused this morning."
 voragons.205.c.tooltip: "You choose not to ask questions. Dolores appears at the morning briefing remarkably alert and cooperative, one hand resting comfortably on her still-rounded stomach. The research output today is excellent. §Y+500 Society Research§!."

 # voragons.206 — Formal Complaint
 voragons.206.name: "Formal Complaint"
 voragons.206.desc: "A staff liaison has submitted a formal grievance on behalf of six departments. The common thread is not cruelty. It is, somehow, worse: Dolores will not stop §Imothering§! everyone.\n\nDocumented concerns: §R[1]§! an accounting analyst, consumed mid-presentation after Dolores decided she 'looked peaky and needed looking after,' §R[2-3]§! two HR representatives who attempted to discipline Dolores and were, in her words, 'tucked in instead,' §R[4]§! the Facilities director, who keeps being gathered up 'for his own good,' and §R[5-6]§! constant reports of Dolores watching staff during shift changes, humming, fussing, straightening collars, and murmuring about who looks tired and who isn't eating enough.\n\nDolores has submitted a counter-memo titled §H'A Mother's Concerns Regarding the Wellbeing of My Children.'§! It is twenty-two pages. It is, infuriatingly, full of legitimate workplace safety violations she has catalogued out of genuine worry. She just wants, she writes, §L'to keep every single one of them safe. Is that so wrong?'§!"
 voragons.206.a: "The staff's concerns are valid. Restrict her access."
 voragons.206.a.tooltip: "New access protocols are issued. Dolores receives them with what her assistant describes as §L'pointed silence lasting approximately eight minutes.'§! Staff morale improves. Dolores becomes noticeably hungrier. §Y+150 Unity§!, §R-200 Energy§!."
 voragons.206.b: "Dolores's output justifies the arrangement. Continue as normal."
 voragons.206.b.tooltip: "The liaison's grievance is formally dismissed. The staff receive a memo on §H'Operational Priorities.'§! Dolores is pleased, and shows it in the most useful way she knows. §R-300 Unity§!, §Y+1000 Society Research§!, §Y+500 Physics Research§!. Hunger resets."
 voragons.206.c: "Establish a review committee. We will revisit this in ninety days."
 voragons.206.c.tooltip: "The committee meets once, produces no conclusions, and schedules a follow-up in another ninety days. Nothing changes. Dolores takes the delay as implicit approval. §R-75 Influence§!."

 # voragons.207 — Diplomatic Incident
 voragons.207.name: "A Rescue"
 voragons.207.desc: "An official delegation arrived for a scheduled tour of your central administrative complex. The visit was proceeding smoothly — until Dolores noticed how the visiting ambassador spoke to his §Lslightly built junior attaché§!. The shouting. The little flinches. The way the young one had clearly not slept or eaten properly in weeks.\n\nWitnesses say Dolores went very still, and then very warm. She crossed the room, gently took the trembling attaché by the hand, told them §L'you don't have to go back to him, sweetheart,'§! and resolved the matter in a way that has caused the delegation to file a §Rformal diplomatic protest§! and the ambassador to require a sedative.\n\nDolores's own account is titled §H'A Rescue.'§! It reads, in part: §L'He was cruel to that child. Now that child is safe and warm and loved, forever, and will never be shouted at again. I would do it a hundred times. Send me the unhappy ones, the frightened ones, the ones nobody else wants. I have room for all of them.'§!"
 voragons.207.a: "Issue a full formal apology to the delegation."
 voragons.207.a.tooltip: "Reparations are offered. A letter of regret is dispatched and carefully framed around the words §L'cultural misunderstanding.'§! The ambassador remains displeased but accepts the settlement. The Texture Notes are — against everyone's better judgment — of genuine scientific interest. §R-150 Influence§!, §Y+600 Society Research§!."
 voragons.207.b: "Characterize it as protecting a mistreated youth."
 voragons.207.b.tooltip: "Your diplomats lean into the rescue narrative. It is not a strictly accepted use of force — but the ambassador's reputation does not survive the inquiry into how he treated his staff. The transcripts are sealed. §R-200 Unity§!, §R-100 Influence§!."
 voragons.207.c: "Ask Dolores to document what she learned."
 voragons.207.c.tooltip: "Dolores is delighted to help, and produces a thorough, oddly tender study of the young attaché — and of §L'the fear they finally let go of, at the very end.'§! It is remarkable science and faintly heartbreaking. §R-150 Unity§!, §Y+1200 Society Research§!."

 # voragons.208 — The Quarterly Appraisal
 voragons.208.name: "The Quarterly Appraisal"
 voragons.208.desc: "Dolores has submitted a document. It was not requested. It is §Rforty-three pages long§! and it is, essentially, a scrapbook.\n\nContents include:\n— §H'My Children: A Complete Register'§!, in which Dolores has catalogued every single member of your administration, with notes on their birthdays, their worries, who they're sweet on, and who needs §L'extra looking-after'§!\n— §H'Section VII: Who Isn't Eating Enough'§!, a worried, detailed list\n— §H'Appendix C: My Dear Ones'§!, eight names she is especially, achingly fond of, three marked with a small drawn heart and the note §L'soon, I think — I can't bear them being out in the cold much longer'§!\n\nIt is impeccably formatted, deeply sincere, and absolutely terrifying. She has enclosed a separate note: §L'I just want you all to know how much I see you. How much I love every one of you. Even the ones I haven't gotten to keep yet.'§!"
 voragons.208.a: "Archive this in the classified records. It does not leave that room."
 voragons.208.a.tooltip: "The document is sealed, stamped, and filed in a secure location where no one will accidentally read Appendix C during a routine audit. §R-100 Unity§! (for the administrative staff who had to process it)."
 voragons.208.b: "Have Dolores present it to the full council."
 voragons.208.b.tooltip: "Dolores presents with considerable enthusiasm. The council is riveted, disturbed, and ultimately impressed by the methodological rigor. The data in Section IV alone accelerates three research programs. Several council members quietly scan Appendix C for their own names. §Y+100 Influence§!, §Y+500 Society Research§!, §R-200 Unity§!."
 voragons.208.c: "Quietly forward Appendix C to those named in it."
 voragons.208.c.tooltip: "The eight individuals are notified. Their productivity increases by an average of forty percent within the week. Three have submitted voluntary transfer requests alongside their output reports. The fear, apparently, is extremely motivating. §Y+700 Engineering Research§!, §R-100 Unity§!."

 # voragons.209 — The Fan Letter
 voragons.209.name: "The Fan Letter"
 voragons.209.desc: "Dolores has received personal correspondence.\n\nThe letter is from a lonely citizen of a distant world — someone with no family, no one waiting for them, who writes that they have heard there is a §L'someone'§! in your empire who §L'takes people in and keeps them safe and loved forever.'§! They ask, with heartbreaking politeness, whether there might be room for one more. A photograph is enclosed. The postscript reads: §L'I'm very small, and I don't eat much, and I'd be no trouble at all. I just don't want to be alone anymore.'§!\n\nDolores has read the letter §Rseventeen times§!. It is framed on her desk. She has been crying, a little, in the way of someone who is very happy and very full of love.\n\n§L'Of course there's room,'§! she keeps murmuring. §L'Oh, of course there is. There's always room for one more. Nobody should ever have to be alone.'§!"
 voragons.209.a: "Arrange for the visitor to be brought here."
 voragons.209.a.tooltip: "Travel is arranged. Dolores is in an exceptional mood for the rest of the quarter. What occurs during the visit is, by mutual understanding, not formally documented. The hunger situation tracker resolves itself. §Y+800 Society Research§!. Hunger resets."
 voragons.209.b: "Decline politely on Dolores's behalf."
 voragons.209.b.tooltip: "A response is drafted — courteous, warm, and final. Dolores reads it, sets it down, and says nothing for eleven minutes. She is noticeably less pleasant for the following week and keeps glancing at the framed photo. §R-50 Influence§!."
 voragons.209.c: "Leave Dolores to handle the correspondence herself."
 voragons.209.c.tooltip: "Dolores writes back personally. You do not ask to read the letter. Arrangements are made privately over the following week. Two weeks later, Dolores appears deeply satisfied and declines to elaborate further. §Y+600 Physics Research§!. Hunger resets."

 ###################################
 #   NSFW EVENTS
 ###################################

 # voragons.210 — A Formal Request
 voragons.210.name: "A Formal Request"
 voragons.210.desc: "A junior logistics coordinator — Level 3 clearance, two years on staff, excellent performance reviews — has submitted a formal personal request through the HR system.\n\nIt is three pages long. It is carefully, painstakingly worded. It makes its subject matter clear with a specificity that caused the HR intake system to flag it for manual review and the reviewing officer to take a brief personal break before continuing.\n\nThe request is to spend an evening with Dolores. The nature of the evening is not ambiguous. The request uses phrases like §L'at her discretion,'§! §L'entirely on her terms,'§! and §L'I have thought about this quite a lot'§! and then, in a footnote: §L'quite a lot.'§!\n\nDolores was forwarded the request as a formality.\n\nShe countersigned it within forty seconds. Her approval note reads: §L'Yes. This evening if possible. I will handle the arrangements. Please advise management that I will not be available until morning and that this is a good thing.'§!\n\nShe is currently waiting."
 voragons.210.a: "Authorize the visit."
 voragons.210.a.tooltip: "The request is approved. Dolores's schedule is cleared for the evening. She is at her desk when the notification arrives; witnesses report she closes her eyes briefly and smiles in a way that is quite difficult to describe. She does not come in for briefings the next morning, but she does submit a warm internal commendation for the logistics coordinator's §L'exceptional initiative and outstanding professional judgment.'§! §Y+100 Unity§!, §Y+600 Society Research§!. Hunger resets."
 voragons.210.b: "Deny. This falls outside permitted staff relations policy."
 voragons.210.b.tooltip: "The request is formally declined. The logistics coordinator accepts this with visible disappointment. Dolores accepts it with a silence that lasts approximately twelve minutes. Both parties continue doing their jobs with considerably less enthusiasm than before. §R-100 Unity§!."
 voragons.210.c: "Authorize — and request a formal debrief report afterward."
 voragons.210.c.tooltip: "The visit is approved with a single administrative condition. Dolores reads the debrief requirement and nods slowly, apparently finding it more amusing than intrusive. What she submits the following morning is not precisely what a standard after-action report looks like, but it contains detailed notes on cognitive response under unusual conditions, several anatomical observations, and an appendix that three researchers immediately flag as a significant scientific contribution. §Y+1200 Society Research§!, §Y+600 Physics Research§!. Hunger resets."

 # voragons.211 — Contentment
 voragons.211.name: "Contentment"
 voragons.211.desc: "There is a sound coming from Dolores's quarters.\n\nIt has been occurring for approximately two hours. Security has logged it as §L'rhythmic,'§! §L'low-frequency,'§! and §L'not distressing, exactly, but not something any of us want to examine too closely.'§!\n\nDolores has placed a handwritten note on her door: §H'DO NOT DISTURB — PROCESSING.'§! Below it, in slightly smaller lettering: §L'This is pleasant. Everything is fine. Please go away.'§!\n\nThe hunger situation tracker is no longer active. Whatever arrangement is in progress in there, it is clearly going extremely well for at least one of the parties involved, and based on the sounds — which include what the log transcribes as §L'muffled movement, gradually subsiding,'§! followed by §L'a prolonged, deeply settled exhalation,'§! followed by what can only be described as §Lpurring§! — it is going quite well for both."
 voragons.211.a: "Leave her to it. This is no one's business."
 voragons.211.a.tooltip: "The night shift staff agree not to make eye contact with the door. Dolores emerges the next morning looking extraordinarily well-rested, slightly rounder than usual, and in a better mood than anyone can remember. She brings pastries. §R-50 Unity§! (from staff who had to work near the sounds)."
 voragons.211.b: "Check in. Just briefly."
 voragons.211.b.tooltip: "You knock. Dolores opens the door approximately three inches. She is significantly more distended than this morning. She is wearing an expression of such profound satisfaction that it is a little difficult to hold eye contact. She says §L'one moment,'§! pats her stomach once with a slow, appreciative hand, and closes the door again. You file this under §H'senior leadership discretion.'§! §Y+700 Society Research§!, §R-100 Unity§!."
 voragons.211.c: "Quietly reassign the adjacent offices."
 voragons.211.c.tooltip: "Three neighboring offices are vacated and reassigned to a different wing. The occupants are told only that §L'routine maintenance is required.'§! They do not ask further questions. They have been here long enough to know not to. §R-150 Energy§!, §Y+75 Unity§! (from the relocated staff, who are relieved)."

 # voragons.212 — The Willing Party
 voragons.212.name: "The Willing Party"
 voragons.212.desc: "A junior archivist has submitted a formal request.\n\nThe accompanying documentation includes: §H[1]§! a two-page personal statement, §H[2]§! a signed §H'Declaration of Informed Consent and Enthusiastic Participation'§! (notarized), §H[3]§! a self-compiled research summary titled §L'Pre-Consumption Considerations: A Personal Review of Available Literature,'§! and §H[4]§! a handwritten cover note at the bottom that reads, in careful letters: §L'I have been thinking about this for a very long time. I would very much like to do this. Please say yes.'§!\n\nDolores was forwarded the packet. She read it in full, set it down, read it again, and then looked up.\n\nThe clerk who delivered it describes her expression as §L'the warmest thing I have ever seen on a machine face,'§! and immediately adds: §L'which was also somehow the most frightening thing I have ever seen.'§!\n\nDolores has formally requested your authorization. She is sitting very still. She is trying not to look like she is hoping."
 voragons.212.a: "Authorize. All parties have consented."
 voragons.212.a.tooltip: "Authorization is granted. Dolores submits a formal thank-you memo to your office within the hour — the first time she has ever done so — and then proceeds to make very thorough arrangements. The archivist submits their own final note to the record, which reads §L'exactly as I imagined, which is saying something.'§! The research data generated by the experience is extensive, well-organized, and frankly remarkable. §Y+200 Unity§!, §Y+1000 Society Research§!, §Y+500 Physics Research§!. Hunger resets."
 voragons.212.b: "Deny. We cannot authorize this."
 voragons.212.b.tooltip: "The request is declined. The archivist accepts this with grace and goes back to their desk. Dolores accepts it with seven minutes of complete silence, after which she says §L'noted'§! and returns to her workload. Both of them seem like people who have accepted disappointment before. It does not make it less uncomfortable. §R-100 Unity§!."
 voragons.212.c: "Approve provisionally — on the condition that a report is filed."
 voragons.212.c.tooltip: "Approval is granted with one attached requirement. Dolores nods slowly when she reads the condition and then says, with complete sincerity: §L'That seems entirely fair.'§! The report she submits the following week is one of the most thorough documents ever produced in your administrative record. The archivist is listed in the acknowledgments section as §L'an invaluable and gracious contributor.'§! §Y+100 Unity§!, §Y+1500 Society Research§!. Hunger resets."

 # voragons.213 — Stress Relief
 voragons.213.name: "Stress Relief"
 voragons.213.desc: "Dolores has submitted a wellness request.\n\nThe form is correctly filed. The procedural language is impeccable. The stated reason is: §L'elevated systemic tension and suboptimal caloric reserves necessitating private therapeutic resolution at earliest operational convenience.'§!\n\nShe has attached a personal addendum: §L'I have identified a suitable arrangement. All relevant parties are informed and agreeable. I require two hours, an unobstructed schedule, and for no one to come to my office under any circumstances. The door will be locked. This is, I promise, for everyone's benefit.'§!\n\nThere is a small smiley face drawn in the corner of the addendum. In Dolores's handwriting.\n\nThis is new.\n\nThe two hours she is requesting would fall this afternoon. She is currently at her desk, very still, hands folded, watching the door to your office with an expression that could charitably be called §Lpatient.§!"
 voragons.213.a: "Grant the wellness hour."
 voragons.213.a.tooltip: "The request is approved. Dolores's door locks at precisely the agreed time. For two hours, the wing is quiet save for occasional muffled sounds that the remaining staff learn not to categorize too carefully. Dolores emerges looking as settled as you have ever seen her — slightly fuller, considerably calmer, and in a mood that makes the rest of the day's briefings remarkably smooth. §Y+800 Society Research§!, §Y+400 Physics Research§!. Hunger resets."
 voragons.213.b: "Deny. We need her on schedule today."
 voragons.213.b.tooltip: "The request is declined. Dolores reads the denial, sets it aside, and does her work. She is professional. She is also noticeably hungrier as the afternoon progresses, and by the end of the day three separate staff members have independently requested desk relocations. §R-50 Unity§!."
 voragons.213.c: "Approve and log it as mandatory staff wellness time."
 voragons.213.c.tooltip: "The request is approved and entered into the official record under §H'Leadership Wellness Initiative.'§! Dolores reads the classification. She is quiet for a moment. Then she says §L'that is very thoughtful of you,'§! and means it. The formal designation provides cover for future wellness hours, which staff find deeply reassuring to have policy for. §R-200 Energy§!, §Y+150 Unity§!, §Y+600 Society Research§!. Hunger resets."

 # voragons.214 — Standing Arrangement
 voragons.214.name: "Standing Arrangement"
 voragons.214.desc: "You are learning, somewhat belatedly, that Dolores has established a private arrangement with a member of the administrative staff.\n\nYou are learning about it now because a personal message intended for Dolores was accidentally routed through the public internal mail server. The message was live for approximately four minutes before being recalled. In that time, it was opened by §Rfourteen people.§!\n\nThe subject line was: §L'last Tuesday.'§!\n\nThe administrative staff member in question has been achieving a §R47%§! performance increase over the past six weeks. Their manager's notes describe them as §L'transformed,'§! §L'astonishingly motivated,'§! and §L'occasionally distracted in a way that suggests they are thinking about something very specific.'§!\n\nDolores, when tactfully approached on the subject, confirms the arrangement exists. She describes it as §L'working extremely well for both parties'§! and produces a small personal planner — hand-written, neatly organized — with future sessions already scheduled. She shows it to you only briefly.\n\nThe sessions are labeled §L'maintenance.'§!"
 voragons.214.a: "Leave this entirely alone. It is clearly working."
 voragons.214.a.tooltip: "You close the file and do not bring it up again. The fourteen people who read the message agree, without discussion, to adopt the same policy. Dolores continues her sessions. The administrative staff member continues being extremely productive. Everyone pretends not to know anything. It goes very well. §Y+500 Society Research§!."
 voragons.214.b: "Formally endorse it as an approved staff wellness program."
 voragons.214.b.tooltip: "The arrangement is given official status under §H'Leadership Integration Wellness Protocol,'§! complete with scheduling support and a modest operational budget. Dolores reads the formal endorsement, looks up, and says §L'hm.'§! After a pause, she adds: §L'thank you.'§! The staff member is delighted. Staff morale, broadly, is complicated but net positive — people appreciate that management is at least trying to be sensible about things. §R-300 Energy§!, §Y+200 Unity§!, §Y+600 Society Research§!, §Y+400 Physics Research§!."
 voragons.214.c: "Request to see the staff member's next productivity report."
 voragons.214.c.tooltip: "The report arrives. It is extraordinary. The research applications alone span three departments. There is a small personal note at the end, not addressed to anyone in particular, that reads: §L'worth it.'§! Dolores, when shown the note, looks at it for a long moment and then carefully folds it into her pocket. §Y+600 Engineering Research§!, §Y+600 Society Research§!."
