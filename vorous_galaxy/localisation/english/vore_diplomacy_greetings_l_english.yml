 VORE_NEUTRAL_GREETING_01: "*Gulp*... Ah, apologies. I prefer my lunch extra rare."
 VORE_NEUTRAL_GREETING_02: "*URP~* Oh, don't worry, it's not one of you."
 VORE_NEUTRAL_GREETING_03: "Visitors? *GURP* What visitors?"
 VORE_NEUTRAL_GREETING_04: "Ah, that hit the spot... oh, [from.GetSpeciesName], you're here? "
 VORE_NEUTRAL_GREETING_05: "...urgh, why do you KEEP MOVING? Huh? No, I wasn't talking to you/"
 VORE_NEUTRAL_GREETING_06: "Gah, when will they finally pass... OH! Hello..."
 VORE_NEUTRAL_GREETING_07: "*BHWRPP* Oh, you didn't hear that, did you?"  
 #VORE_NEUTRAL_GREETING_08: ""

 VORE_FRIENDLY_GREETING_01: "Oh, [from.GetSpeciesName]! We were just planning to invite your ambassador to a dinner. Does your kind prefer their prey willing or not?"
 VORE_FRIENDLY_GREETING_02: "Greetings, friends. The sight of you calms our stomachs."
 VORE_FRIENDLY_GREETING_03: "What are the chances, [from.GetSpeciesName]? You called just after the lunch. Seems that next time we'll have to leave some."
 VORE_FRIENDLY_GREETING_04: "Hah! The sight of you could cure any heartburn, [from.GetSpeciesName]."
 VORE_FRIENDLY_GREETING_05: "Greetings, [from.GetSpeciesName]! Do you need us to... remove... someone?"
 VORE_FRIENDLY_GREETING_06: "[from.GetSpeciesName], you're a delight for sore stomachs."
 VORE_FRIENDLY_GREETING_07: "Welcome, friends. Don't worry, we're full."  
 
 #Prey#
 VORE_PREY_HOSTILE_GREETING_01: "W-we are watching your every move, [from.GetSpeciesName]. What do you want?"
 VORE_PREY_HOSTILE_GREETING_02: "We are definitely FIERCE warriors, so speak quickly!"
 VORE_PREY_HOSTILE_GREETING_03: "Never assume we are helpless, foul beasts. We cause indigestion!"
 VORE_PREY_HOSTILE_GREETING_04: "You want something? Over there is the door, [from.GetSpeciesName]."
 VORE_PREY_HOSTILE_GREETING_05: "Drop those hungry eyes and we might let you speak, [from.GetSpeciesName]."
 VORE_PREY_HOSTILE_GREETING_06: "We are not surredering one of us to you, if that´s what you came here for, [from.GetSpeciesName]."
 
 VORE_PREY_NEUTRAL_GREETING_01: "[Root.GetSpeciesName] are not toys nor food, so please make this quick."
 VORE_PREY_NEUTRAL_GREETING_02: "Stop looking at us like that or we won´t listen to you, [from.GetSpeciesName]."
 VORE_PREY_NEUTRAL_GREETING_03: "You´re not hungry? Please be not hungry."
 VORE_PREY_NEUTRAL_GREETING_04: "Don´t tell me you came to nibble on us, [from.GetSpeciesName]."
 
 VORE_PREY_FRIENDLY_GREETING_01: "We [Root.GetSpeciesName] do our best to help. No munching on us though."
 VORE_PREY_FRIENDLY_GREETING_02: "The [Root.GetSpeciesName] are happy to help but please restrain yourselfs on certain aspects."
 
 #Endo#
 VORE_ENDO_HOSTILE_GREETING_01: "It´s not safe for talks if you don´t want to stay forerver, [from.GetSpeciesName]."
 VORE_ENDO_HOSTILE_GREETING_02: "Be quick. We [Root.GetSpeciesName] have no patience for toys."
 VORE_ENDO_HOSTILE_GREETING_03: "Be a good toy and squirm after you´re done talking, [from.GetSpeciesName]."
 VORE_ENDO_HOSTILE_GREETING_04: "Will you be missed if you don´t return after this?"
 VORE_ENDO_HOSTILE_GREETING_05: "Morsels like you don´t deserve to speak to us, [from.GetSpeciesName]."
 
 VORE_ENDO_NEUTRAL_GREETING_01: "We have other busnesses to attend to or do you volunteer to be our buisness?"
 VORE_ENDO_NEUTRAL_GREETING_02: "Something urgent that you have to risk bothering us?"
 VORE_ENDO_NEUTRAL_GREETING_03: "I wonder how you taste, [from.GetSpeciesName]. Anyway what is it?"
 VORE_ENDO_NEUTRAL_GREETING_04: "What? We are too busy playing with our toys."
  
 VORE_ENDO_FRIENDLY_GREETING_01: "Always a special pleasure to have you, [from.GetSpeciesName]."
 VORE_ENDO_FRIENDLY_GREETING_02: "Need our help? We are happy to stuff- ACCOMMODATE [From.GetSpeciesNamePlural]."
 VORE_ENDO_FRIENDLY_GREETING_03: "Yes? [Root.GetSpeciesName] have always a special seat open for talks with you."
 VORE_ENDO_FRIENDLY_GREETING_04: "After we are done with this, wanna have fun, [from.GetSpeciesName]?"
 VORE_ENDO_FRIENDLY_GREETING_05: "A conversaton can always be made more interesting than this, [from.GetSpeciesName]."