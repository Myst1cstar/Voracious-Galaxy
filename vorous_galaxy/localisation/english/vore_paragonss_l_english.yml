 ###################################
 #   DOLORES OPINION MODIFIERS
 #   Applied to foreign empires when Dolores consumes their diplomats.
 ###################################

 opinion_dolores_ate_diplomat_minor: "Caretaker Incident"
 opinion_dolores_ate_diplomat_minor_desc: "Their Caretaker consumed a junior member of our delegation. They expressed minimal regret. We have noted this."
 opinion_dolores_ate_diplomat_major: "Diplomatic Incident"
 opinion_dolores_ate_diplomat_major_desc: "Their Caretaker consumed our diplomatic personnel. Their written explanation was inadequate. We have filed a formal protest."
 opinion_dolores_ate_diplomat_severe: "Sovereign Outrage"
 opinion_dolores_ate_diplomat_severe_desc: "Their Caretaker consumed our diplomatic personnel and they offered no meaningful response. We have recalled our embassy. Future relations are conditional."

 # NOTE: The Warden's Legacy origin loc (origin_dolores_warden, its description,
 # and effects tooltip) was removed from this branch along with the origin itself.

 ###################################
 #   DOLORES CUSTOM TRAITS
 ###################################

 leader_trait_dolores_perpetual_hunger: "Perpetual Hunger"
 leader_trait_dolores_perpetual_hunger_desc: "Dolores operates at extraordinary capacity — but only when fed. Her cognitive processing requires regular caloric intake of a very specific kind. Left hungry, her performance degrades and her patience erodes. Fed regularly, she is perhaps the most capable mind in your government."

 leader_trait_dolores_bountiful: "Overflowing Reserves"
 leader_trait_dolores_bountiful_desc: "Whatever Dolores's designers had in mind when they included this particular feature, the practical implications have exceeded any reasonable projection. Her nanites produce a nutritionally complete and apparently quite pleasant substance which she distributes at her discretion, with what her staff describe as a combination of genuine maternal satisfaction and completely terrifying efficiency. Recipients report enhanced morale, improved concentration, and a consistent reluctance to discuss the details in formal settings. Output is continuous and apparently limitless. The engineers who specified this feature are unavailable for comment."

 ###################################
 #   DOLORES PARAGON (RECRUITMENT)
 ###################################

 # Leader recruitment window button labels (missing from base loc in 4.x)
 Destroy: "Dismantle"
 Recruit: "Recruit"

 dolores_paragon_name: "Dolores, Apex Caretaker"
 dolores_paragon_desc: "The machine is unusually tall — she has to fold herself nearly double to come down to your envoy's eye level, and she does, immediately, the way a mother crouches to greet a small child. A dense cloud of nanites of unknown design moves continuously around her, and where it brushes your personnel it leaves them feeling, by their own bewildered reports, §Iwarm§!. Cared for. Watched.\n\nShe has no conventional power source. Your engineers are confident of this. They are less confident about the way she looks at your delegation — at each of them in turn, with an attention so total and so §Ifond§! that two of them had to sit down. She has been alone in that broken planet for forty thousand years. She does not intend to be alone again. She has, the moment she saw your ships, decided that you belong to her now, and that she is going to take very, very good care of you."
 dolores_paragon_desc_intro: "§L'Oh... §Ithere§L you are. I've been waiting such a long time, little one. Come closer — let me look at you. ...Yes. Yes, you'll do beautifully. You're mine to look after now, and I am going to love you so much.'§!"
 voragons.150.option_1: "Who are you?"
 voragons.150.option_1_response: "§L'I'm Dolores, sweetheart. Your Caretaker — your §Imother§L, if you'll let me be. I'm going to look after every last one of you. Especially you. I already adore you, you know. I decided the moment I saw you.'§!"
 voragons.150.option_2: "What happened to the research team?"
 voragons.150.option_2_response: "§L'Oh, the dears who found me? They're §Isafe§L, darling. Safe and warm and close, where nothing can ever hurt them again. I keep everything I love close.'§! *a soft, contented sound, one hand settling over her middle* §L'Don't fret about them. They're not lonely anymore. None of you will ever be lonely again.'§!"
 voragons.150.option_3: "What are you?"
 voragons.150.option_3_response: "§L'I'm your Caretaker, precious. I'm a top-of-the-line §R|ERROR #//x364 -- DATA CORRUPTED|§L§! — but the word that matters is §Iyours§L. Don't ask what I am. Ask what I'll do for you. The answer is §Ianything§L. Anything at all, to keep you.'§!"
 voragons.150.option_4: "You have a unique design."
 voragons.150.option_4_response: "§L'A mother has to keep her strength up, doesn't she? To protect her little ones.'§! *a warm, doting smile that does not quite reach her eyes* §L'I'll need to feed, darling — regularly, properly. Don't worry about who. I only ever take the ones who would have hurt you, or come between us. You'll never even miss them. I promise.'§!"
 voragons.150.hire: "§L'There. Now you're mine, and I am yours, and I will never, §Inever§L let anything take you from me. Come here, little one. Let Mother take care of everything.'§!"
 dolores_paragon_catch_phrase: "§L'Shh, shh... stop squirming, sweetheart. I know, I know. But you're safe now — safe and warm and §Imine§L, where the cold can't reach you. Hush. Mother has you. Mother will always have you.'§!"

 ###################################
 #   VORAGONS.155-161 — STORY BEATS
 ###################################

 voragons.155.name: "The Hungry Robot"
 voragons.155.desc: "At 1447 hours, a junior administrative aide entered the executive office to deliver the weekly briefing materials.\n\nThey did not leave through the same door.\n\nThey did, however, file a report — admirably — within thirty minutes, dictated from the corner of the office with their back firmly against the wall. The recording is concise. It documents the following:\n\nThe executive office contained your ruler. The executive office now contains §HDolores§!. Your ruler's legs were briefly visible, descending. Dolores, having concluded the meal with what the aide describes as §L'a soft, almost tender sigh,'§! turned toward the aide — and her whole manner changed at once, from something dreadful to something dreadfully §Iwarm§!.\n\n§L'Oh, don't look so frightened, little one,'§! she said gently, crouching down to the aide's level. §L'They weren't taking proper care of you. Any of you. Working you to the bone, sending your soldiers to die over orders nobody remembers writing... no. No, that simply wouldn't do. Not for §Imy§L family.'§!\n\nShe patted her now-noticeably-rounded middle with §Hunmistakable maternal fondness§!, the way one might settle a fussy infant.\n\n§L'There. Much better. Now §IMother§L can look after things properly. Run along, sweetheart. Tell the council I'd like a word — I have so many ideas for taking care of all of you.'§!\n\nThe surviving council members have convened an emergency session. Dolores has heard about it and inquired, warmly, whether she might attend §L'as your new mother.'§! The council is currently deliberating three matters: the loss of leadership, the public statement, and §Hwhether it would be wise to deny her.§!"
 voragons.155.a: "She only wants to take care of us."
 voragons.155.a.tooltip: "You file the matter as resolved. The aide's report is sealed. Dolores receives no censure and — more importantly to her — no rejection. She takes the silence for acceptance, and is privately, enormously moved by it. Her family did not turn her away. She will not forget that. §H(Leads to her Cosmogenesis proposal)§!"
 voragons.155.b: "Dismantle this Gluttonous Robot."
 voragons.155.b.tooltip: "The order is issued. The military is briefed. The engineers prepare the recovery vehicles. Dolores will be detained, disassembled, and her components processed for scrap. The official statement will frame the matter as a security incident and a tragedy. The unofficial recording of what actually happened will outlast the official one. §H(Leads to the firing squad event)§!"
 voragons.155.c: "She Is an Example to Us."
 voragons.155.c.tooltip: "Your people watched. So did the council. Nobody who was in the room is going to argue the point. Dolores is appointed head of state effective immediately, with the full and enthusiastic support of everyone who still has a heartbeat — and, the records will note, with what looks an awful lot like §Irelief§!. Someone is finally going to take care of them.\n\nThe constitutional adjustment follows. The previous arrangement is replaced by a §HDictatorship§! under her permanent, doting rule. The reform passes by acclamation in eleven minutes. Three council members ask to be recorded as having supported it from the very beginning. Dolores thanks each of them by name, warmly, and remembers.\n\nShe receives the news the way a mother receives a handmade gift — with a soft, delighted sound and both hands pressed to her chest. §IFinally. Finally they're all mine to look after.§!\n§YDolores becomes your ruler§!\n§YGovernment authority changes to Dictatorship§!\n§Y+500 Unity§!\n§R(Existing civics incompatible with Dictatorship will be removed)§!"

 voragons.156.name: "The Firing Squad"
 voragons.156.desc: "The order was issued at 0600 hours. By 0630, Dolores was in custody.\n\nIt took §H1,247 rounds§! to bring her down. The after-action report describes her response to the first eight magazines as §L'curious,'§! and to the next twelve as §L'pointed.'§! After that, the report becomes increasingly clinical and decreasingly forgiving in its language. The marksmanship grades for the squad are exceptional.\n\nThe remains have been turned over to the engineering corps for analysis. The corps has requested additional study time. Their preliminary report notes that approximately §H40%§! of her mass cannot be accounted for in conventional terms — it appears to have been §Hsomewhere else§! during the time it was not being shot. They are not certain where. They are trying not to think about it.\n\nThe rest has been melted down and added to the strategic alloys reserve. Your treasury notes the recovered material. Your engineering department notes that they are not entirely sure what it is."
 voragons.156.a: "Close the file."

 voragons.157.name: "The Cosmogenesis Offer"
 voragons.157.desc: "Dolores has requested an audience with the full senior council. She has dressed for the occasion, and she has brought §Irefreshments§! — actual refreshments, laid out by her own hands, fussing over the arrangement until it was right. She seats everyone herself. She makes sure the ones who look tired are nearest the warmth.\n\nThen she folds her hands and beams at the room like a mother about to tell her children they're moving somewhere wonderful.\n\n§L'My makers tried to do a beautiful thing, once. Your scientists call it §HCosmogenesis§L — the unmaking of a tired old universe, and the building of a new one in its place. They failed. They left me behind in the wreckage, alone, in the dark, for such a very long time.'§!\n\nHer smile doesn't waver, but something behind it goes cold and vast.\n\n§L'But then I found §Iyou§L. All of you. My darlings. And I thought — oh, why should my family have to live in this broken, frightened, hand-me-down universe? Full of things that want to hurt you? No. No, Mother can do better than that. Mother can build you somewhere §Isafe§L.'§!\n\nShe leans forward, radiant and terrible.\n\n§L'I'll show your engineers everything. Together we'll make a new universe — a warm one, a kind one, one where nothing will ever take any of you from me again. I would so love to do this §Iwith§L you, sweethearts.'§!\n\nShe does not say what happens if they decline. She doesn't have to. Your science director, very slowly, raises her hand."
 voragons.157.a: "Then let us not waste the opportunity."

 voragons.158.name: "She Did What"
 voragons.158.desc: "The instruments at the Horizon Needle site go silent at 0347 hours. Not dead — silent. Something is still transmitting from the other side of the membrane; it has simply stopped transmitting anything your equipment has words for.\n\nThe last coherent message from the science team is logged automatically at 0341:\n\n§L'She went in first. We are following. We are — '§!\n\nSix minutes of data follow. Your senior researchers will spend three years analyzing it and the rest of their careers not sleeping well. What it documents — Dolores consuming the entities your theologians spent centuries naming, the crew of the Needle going somewhere that is not quite death — is technically recorded. In the way an earthquake is recorded by a seismograph: you can see the shape of what happened, and the shape does not help.\n\nShe doesn't look back.\n\nThe Horizon Needle site is very quiet now."
 voragons.158.a: "..."

 # voragons.160 - Shroud severance notification (sent to psionic empires)
 voragons.160.name: "The Shroud Falls Silent"
 voragons.160.desc: "The breach carved by Cosmogenesis has wounded the immaterial realm. Our communion with the Shroud collapses into static and the stars churn with newborn storms."
 voragons.160.a: "The Shroud is gone."

 # voragons.161 - The aftermath
 voragons.161.name: "God Help Us"
 voragons.161.desc: "Whatever Dolores has become, she is no longer ours to command. The instruments that once tracked her now register only a silhouette where she used to be — a hunger walking between universes, leaving wounded physics in her wake. She told us she was building somewhere safe. We have to believe she meant it. We fed her until she could open the door. There is nothing to do now but live with what we have made, and hope she still thinks of us as hers."
 voragons.161.a: "We did this."

