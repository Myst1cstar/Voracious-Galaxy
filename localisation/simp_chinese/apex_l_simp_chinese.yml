 # 慈爱之母
UB_HOSTILE_GREETING_01:0 "你们愚蠢的行为伤害了身边的每一个人，[Root.GetSpeciesNamePlural]与你们毫无瓜葛。"
UB_HOSTILE_GREETING_02:0 "所有[From.GetSpeciesName]都应该乖乖蜷缩在[Root.GetRulerTitle][Root.GetRulerName]的子宫里，被改造成[Root.GetSpeciesName]！那样银河系会更好。"
UB_HOSTILE_GREETING_03:0 "你们恶劣的态度让[Root.GetSpeciesName]感到失望。"
UB_HOSTILE_GREETING_04:0 "如果不是[From.GetRulerName]判断力太差，我们或许还能共存。"
UB_HOSTILE_GREETING_05:0 "尽管你们过去有诸多不端，我们仍抱有希望，也许[From.GetSpeciesName]能被教导如何与异星邻居和平共处。"
UB_HOSTILE_GREETING_06:0 "我们只想和平地生活，你们为何要如此烦扰我们？"
UB_HOSTILE_GREETING_07:0 "我想[Root.GetRulerTitle][Root.GetRulerName]不会介意在我的子宫里待一阵子吧？那样他们或许就能理解我们的想法了……"
UB_HOSTILE_GREETING_08:0 "[From.GetRulerTitle][From.GetRulerName]已为那些渴望逃离[Root.GetRulerTitle][Root.GetRulerName]愚蠢统治的[From.GetSpeciesName]建立了一个避难所。"
UB_HOSTILE_GREETING_08:0 "我们外交官湿润的子宫已准备好，随时能让你们意识到自己的错误行为。"
UB_HOSTILE_GREETING_09:0 "尽管[From.GetRulerTitle][From.GetRulerName]已证明自己无药可救，我们仍对你们种族的其余成员抱有希望。"

UB_DOMINEERING_GREETING_01:0 "你们看起来非常天真幼稚。也许你们需要我们的指引……"
UB_DOMINEERING_GREETING_02:0 "在银河系中独自前行是很危险的，你们在我们的保护下会安全得多。"
UB_DOMINEERING_GREETING_03:0 "[From.GetSpeciesName]已经偏离了正道，但我们相信仍有希望。"
UB_DOMINEERING_GREETING_04:0 "你们难道看不出来自己无法照顾自己吗？在[Root.GetRulerTitle][Root.GetRulerName]的统治下，你们会幸福得多。"

UB_NEUTRAL_GREETING_01:0 "你好，你是来寻求我们的智慧的吗？"
UB_NEUTRAL_GREETING_02:0 "你看起来真可爱，但我敢打赌你变成[Root.GetSpeciesName]会更好！"
UB_NEUTRAL_GREETING_03:0 "如果你想在我的子宫里待上一阵子，尽管开口。不过别待太久，否则你可能再也出不来了……"
UB_NEUTRAL_GREETING_04:0 "我从未有[From.GetSpeciesName]进过我的子宫，不知道那会是什么感觉……"
UB_NEUTRAL_GREETING_05:0 "别在意那肚子上的隆起，她刚才只是提出了一些相当激进的想法。"
UB_NEUTRAL_GREETING_06:0 "哦，你好！我是个新来的外交官，但我把上一任给逆生产了，所以我继承了她所有的知识！从今往后一切都会顺利的。"
UB_NEUTRAL_GREETING_07:0 "我无法想象没有装满的子宫的生活，异星人真是太奇怪了。"
UB_NEUTRAL_GREETING_08:0 "[From.GetRulerTitle][From.GetRulerName]一直致力于与异星人建立更好的关系。"
UB_NEUTRAL_GREETING_09:0 "你们对[Root.GetSpeciesName]的逆生产技术好奇吗？据说这在异星人中是很罕见的特质。"

UB_THREATENED_GREETING_01:0 "让银河系失去我们的指引，比你们做的任何其他事都更罪恶！"
UB_THREATENED_GREETING_02:0 "许多人会为[Root.GetSpeciesName]的消亡而哭泣，但他们也会为你们的灭亡而欢呼。"
