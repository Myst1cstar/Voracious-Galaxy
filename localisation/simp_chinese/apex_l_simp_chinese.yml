##########
civic_vore_darwinism: "基于吞噬的达尔文主义"
civic_vore_darwinism_desc: "这个社会相信他们作为银河顶级掠食者的命运，不断寻求扩大他们的牲畜群。"
civic_tooltip_vore_darwinism_effects: "提供强大的战斗加成，但这个社会的竞争性本质导致其死亡率较高，且对移民的吸引力较低。\n§Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! 增加 §G15%§!\n§Y$MOD_SHIP_FIRE_RATE_MULT$§! 增加 §G15%§!\n§Y$MOD_ARMY_DAMAGE_MULT$§! 增加 §G15%§!\n§Y领袖经验获取§! 增加 §G25%§!\n§Y$MOD_LEADER_SKILL_LEVELS$§! 增加 §G2§!\n§Y$MOD_COUNTRY_IMMIGRATION_PULL_MULT$§! 减少 §R-25%§!\n§Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! 减少 §R-10§!\n§Y$MOD_POP_GROWTH_SPEED$§! 减少 §R-10%§!"
#civic_vore_strength: "以实力统治"
#civic_vore_strength_desc: "这个社会由最强大的掠食者主导，人们通过吞噬竞争对手来获得地位和等级，最强大的掠食者统治帝国，直到更强大的掠食者出现。"
#civic_tooltip_vore_strength_effects: "这个社会的领袖可以通过提高他们的吞噬能力获得强大的特质，但始终面临被对手或下属吃掉的风险。"
civic_unbirth_absorption: "逆生产吸收"
civic_unbirth_absorption_desc: "这个物种利用其逆生产能力从受害者身上汲取经验和知识，受害者被恢复为 '母亲' 物种的幼儿状态。\n§Y领袖经验获取§! 增加 §G25%§!\n§Y$MOD_LEADER_SKILL_LEVELS$§! 增加 §G2§!\n§Y凝聚力§! 增加 §G15%§!\n§Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! 增加 §G15%§!"
civic_tooltip_unbirth_absorption_effects: "领袖成长更快，并能通过吸收同辈的知识达到更高的熟练水平。"
civic_utopian_prey: "乌托邦猎物"
civic_utopian_prey_desc: "这个社会在其历史早期就摒弃了琐碎的争吵，因此在发动战争的艺术上远远落后于其他太空文明。然而，任何将此视为软弱迹象的人都将会发现，他们统一的身份认同激励着他们以无与伦比的凶猛来对抗入侵者。\n§Y$MOD_COUNTRY_NAVAL_CAP_MULT$§! 减少 §R-20%§!\n§Y$MOD_SHIP_FIRE_RATE_MULT$§! 减少 §R-10%§!\n§Y$MOD_SHIP_HOME_TERRITORY_FIRE_RATE_MULT$§! 增加 §G30%§!\n§Y领袖经验获取§! 减少 §R-15%§!\n §Y凝聚力§! 增加 §G25%§!\n§Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! 增加 §G15%§!"
civic_tooltip_utopian_prey_effects: "用战斗加成换取强大的凝聚力和统治伦理加成。"
civic_voredeity: "神圣掠食者"
civic_voredeity_desc: "这个物种由一位被尊为神明的永生掠食者统治，该掠食者通过吞噬其社会中最强大、最聪明和最美丽的成员来增强力量。"
civic_tooltip_voredeity_effects: "这个物种的统治者获得神圣掠食者特质，使其永生，并为其文明带来许多加成，但代价是其帝国人口增长速度有 §R-10%§! 的惩罚，并与邻国有更大的摩擦。"

