# 吞食战士

VD_HOSTILE_GREETING_01:0: "快说，猎物，不然你就得进我的肚子里了。"
VD_HOSTILE_GREETING_02:0: "你们有没有想过被吃掉是什么感觉？你们[From.GetSpeciesNamePlural]和你们其他的同类很快就会知道了。"
VD_HOSTILE_GREETING_03:0 "真奇怪你们[From.GetSpeciesNamePlural]居然也能发展出宇航技术，不过我们很高兴你们做到了。[Root.GetSpeciesName]要错过这么美味的点心可就太遗憾了。"
VD_HOSTILE_GREETING_04:0 "等[From.GetSpeciesName]都变成肚腩上的肥肉，银河系就会知道谁才是真正的顶级掠食者了。"
VD_HOSTILE_GREETING_05:0 "[From.GetSpeciesName]真是美味，我们很快就能尝到味道了……不管你们愿不愿意。"
VD_HOSTILE_GREETING_06:0 "你是来求我让你进我肚子的吗？"
VD_HOSTILE_GREETING_07:0 "你们应该知道，你们[From.GetSpeciesNamePlural]可是真正的美味佳肴，我们的人民正渴望得到更多……"
VD_HOSTILE_GREETING_08:0 "你们应该知道，有几头牲口想逃回[From.GetName]。我有幸亲手吃了其中一个，味道相当不错。"
VD_HOSTILE_GREETING_08:0 "除非你是来讨论如何最好地将你们可怜的帝国纳入我们的统治，否则就滚开。"
VD_HOSTILE_GREETING_09:0 "我希望你知道，我正热切地期盼着你滑入我咽喉的那一天。"

VD_DOMINEERING_GREETING_01:0 "还要继续这场闹剧到什么时候？你们会非常乐意接受自己在[Root.GetSpeciesName]社会中的位置的。"
VD_DOMINEERING_GREETING_02:0 "你们应该早点服从比你们更优越的种族，这样假装独立只是让[From.GetSpeciesName]蒙羞。"
VD_DOMINEERING_GREETING_03:0 "你们终于认识到自己在银河系中的位置了吗？"
VD_DOMINEERING_GREETING_04:0 "比起被某个暴虐的独裁者奴役，你们难道不更愿意在[Root.GetSpeciesName]的庇护下舒适地生活吗？"

VD_NEUTRAL_GREETING_01:0 "只要你们远离我们的狩猎场，爱做什么都随你们。"
VD_NEUTRAL_GREETING_02:0 "[Root.GetSpeciesName]还没决定你们算不算猎物，所以趁现在好好享受这段和平时光吧。"
VD_NEUTRAL_GREETING_03:0 "虽然我知道不能吃外国使节，但我手下可不是人人都这么有自制力。"
VD_NEUTRAL_GREETING_04:0 "你看起来真好吃……要不是你对[From.GetSpeciesName]这么重要，我现在就把你吃了。"
VD_NEUTRAL_GREETING_05:0 "*呃！* 哦，抱歉，刚解决掉一个烦人的秘书。说吧，你想谈什么？"
VD_NEUTRAL_GREETING_06:0 "我们的科学家推测，对一个[FROM.GetSpeciesName]来说，被[Root.GetSpeciesName]吃掉可能是一种相当愉悦的体验。"
VD_NEUTRAL_GREETING_07:0 "你们不应该这么频繁地来访，等我们会谈结束，我的肚子总是咕咕叫，下次我可能等不到会后就要找点零食了……"
VD_NEUTRAL_GREETING_08:0 "我听说[From.GetSpeciesName]的味道，在[Root.Capital.GetName]根本找不到任何东西能与之相比……"
VD_NEUTRAL_GREETING_09:0 "快点说完，[Root.GetSpeciesName]还要去狩猎呢。"

VD_THREATENED_GREETING_01:0 "你们休想拿我们的掠食者当饭吃，[From.GetSpeciesName]！"
VD_THREATENED_GREETING_02:0 "瞎猫碰上死耗子这种事可不会一直奏效，[From.GetSpeciesName]。总有一天你们也会填满我们的肚子。"
VD_THREATENED_GREETING_03:0 "也许现在是你们占上风，但时间会证明[Root.GetSpeciesName]才是银河系的顶级掠食者——你们不过是猎物罢了！"

VD_FRIENDLY_GREETING_01:0 "啊，我最爱的小点心回来了！开玩笑的，我还不会吃你……暂时不会。"
VD_FRIENDLY_GREETING_02:0 "我们的联盟为我们开辟了许多新的狩猎场，为此我们感谢你们。"
VD_FRIENDLY_GREETING_03:0 "上次你随行的侍从被吃了，我很抱歉，我已经亲口吃掉了那个负责此事的[Root.GetSpeciesName]。"
VD_FRIENDLY_GREETING_04:0 "[Root.GetSpeciesName]人民很高兴知道星海之中还有其他值得尊敬的猎手。"
VD_FRIENDLY_GREETING_05:0 "有些[Root.GetSpeciesName]想知道[From.GetSpeciesName]是否考虑过像我们一样成为顶级猎手？"
VD_FRIENDLY_GREETING_06:0 "[Root.GetRulerTitle][Root.GetRulerName]已颁布法令，[from.GetSpeciesName]将免受我方猎手的捕猎。希望你们能领会这份友谊的宣言。"

VD_WAR_GREETING_01:0 "就在我们说话的这会儿，你们的战士正在被吞噬，用不了多久了……"
VD_WAR_GREETING_02:0 "[Root.GetRulerTitle][Root.GetRulerName]已将我标记为你们的掠食者，我很期待用你们来丰满我的曲线！"
VD_WAR_GREETING_03:0 "这场战争在开始之前就已注定。我们是猎手，你们是猎物，你们终将被吞噬。"
VD_WAR_GREETING_04:0 "我们的战士正靠你们人民的牺牲吃得膘肥体壮。"
VD_WAR_GREETING_05:0 "不论在战场内外，[From.GetSpeciesName]注定要填进[Root.GetSpeciesName]的肚子。"
VD_WAR_GREETING_08:0 "你们来多少军队都行，我们会把他们全吃掉，还有胃口再来第二轮。"
VD_WAR_GREETING_06:0 "我听说[Root.GetRulerTitle][Root.GetRulerName]打算亲自吃掉[From.GetRulerTitle][From.GetRulerName]，还要让整个帝国都看着！"
VD_WAR_GREETING_07:0 "我们的猎手真的很感激能有这个机会磨练技艺。你们将成为我们通往银河统治之路上宝贵的垫脚石。"

 # 附属国问候
VD_VASSAL_GREETING_01:0 "[Root.GetRulerTitle][Root.GetRulerName]已承认你们是我们的上级，我们希望能与主人们一同进行许多伟大的狩猎。"
