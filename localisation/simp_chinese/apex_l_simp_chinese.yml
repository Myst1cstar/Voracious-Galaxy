UB_FRIENDLY_GREETING_05:0 "我刚生完孩子，所以我的子宫准备好接纳下一个了，如果你愿意的话……"
UB_FRIENDLY_GREETING_06:0 "看到我的肚子了吗？有个[From.GetSpeciesName]主动要求被逆生产！我太兴奋了！"

UB_WAR_GREETING_01:0 "我们不喜欢战斗，但别以为这意味着我们会坐以待毙。"
