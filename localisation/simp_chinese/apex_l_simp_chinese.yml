UB_WAR_GREETING_03:0 "[Root.GetSpeciesName]知道如何捕获你们的士兵并尽可能地将他们逆生产，他们在我方帝国将过上比在你们那里好得多的生活。"
UB_WAR_GREETING_04:0 "我们不会因为[From.GetRulerTitle][From.GetRulerName]的行为而对[From.GetSpeciesName]心怀恶意。在你们被击败后，他们将在帝国中被平等对待。"
UB_WAR_GREETING_05:0 "我们的战士每逆生产一个敌人，就多了解一分你们的战术。你们不可能长久地对抗我们。"
UB_WAR_GREETING_08:0 "一旦[From.GetSpeciesName]的威胁被消除，银河系将会安全得多。"
UB_WAR_GREETING_06:0 "我们为生存而战，而你们为贪婪而战。这就是你们会失败的原因。"
UB_WAR_GREETING_07:0 "这场战争结束后，你会像你们帝国中其他每一个被误导的领导人一样，在我的子宫里扭动。"

