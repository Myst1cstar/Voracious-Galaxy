##########
# 特质 #
##########

#物种特质
trait_lethal_vore_predator: "致命吞噬掠食者"
trait_lethal_vore_predator_desc: "§L这个物种进化出了吞食其他体型相近生物的能力。§!\n"
trait_nonlethal_vore_predator: "非致命吞噬掠食者"
trait_nonlethal_vore_predator_desc: "§L这个物种进化出了吞食其他体型相近生物且不杀死对方的能力。§!\n"
trait_vore_prey: "猎物"
trait_vore_prey_desc: "§L这个物种天性温顺且美味。§!\n"
trait_unbirth: "逆生产"
trait_unbirth_desc: "§L这个物种进化出了能缩小并将生物捕获于子宫中的能力。§!\n"

#领袖特质

#统治者特质
trait_ruler_novice_predator: "新手掠食者"
trait_ruler_novice_predator_desc: "§L这位统治者几乎没有任何吞噬他人的经验，这使他们成为帝国内许多人的目标。§!\n"
trait_ruler_apprentice_predator: "学徒掠食者"
trait_ruler_apprentice_predator_desc: "§L这位统治者存活了足够长的时间，获得了一些作为掠食者的经验。§!\n"
trait_ruler_adept_predator: "娴熟掠食者"
trait_ruler_adept_predator_desc: "§L这位统治者已经吞噬了相当多的挑战者。§!\n"
trait_ruler_expert_predator: "专家掠食者"
trait_ruler_expert_predator_desc: "§L这位统治者以技艺精湛的可怕掠食者而闻名。§!\n"
trait_ruler_master_predator: "大师掠食者"
trait_ruler_master_predator_desc: "§L这位统治者无疑是帝国内最强大的掠食者，名副其实。§!\n"
trait_ruler_prey: "猎物"
trait_ruler_prey_desc: "§L这位统治者怀有成为猎物的幻想。§!\n"
trait_ruler_motherly: "慈母般"
trait_ruler_motherly_desc: "§L这位统治者像母亲对待自己的孩子一样关心她的臣民，人民的幸福和需求始终是她心中最重要的。§!\n"
trait_ruler_voredeity: "神圣掠食者"
trait_ruler_voredeity_desc: "§L这位统治者是截然不同级别的掠食者，通过吞噬和吸收无数个体获得了永生，并被其人民尊为神明的化身。他们的话语在其疆域内即是法律，但其他文明觉得他们所享有的狂热忠诚具有威胁性。§!\n"

#总督特质
trait_governor_novice_predator: "新手掠食者"
trait_governor_novice_predator_desc: "§L这位领袖被认为是个弱小的掠食者，他们可能活不了多久……§!\n"
trait_governor_apprentice_predator: "学徒掠食者"
trait_governor_apprentice_predator_desc: "§L这位领袖设法获得了一些吞噬他人的经验。§!\n"
trait_governor_adept_predator: "娴熟掠食者"
trait_governor_adept_predator_desc: "§L这位领袖对吞噬他人有一定程度的熟悉，能存活如此之久已开始体现在他们的能力上。§!\n"
trait_governor_expert_predator: "专家掠食者"
trait_governor_expert_predator_desc: "§L与他人竞争职位的斗争给这位领袖留下了丰富的经验。§!\n"
trait_governor_master_predator: "大师掠食者"
trait_governor_master_predator_desc: "§L很少有人愿意尝试吃掉这位经验丰富的掠食者，因为大多数人对于这位领袖来说都只是免费的一餐。§!\n"
trait_governor_prey: "猎物"
trait_governor_prey_desc: "§L这位领袖怀有成为猎物的幻想。§!\n"

#科学家特质
trait_scientist_prey: "猎物"
trait_scientist_prey_desc: "§L在社会中更贪婪的成员看来，这位科学家是猎物，他们自己也心知肚明。这使得他们在行动中非常谨慎和有条理。§!\n"
trait_scientist_novice_predator: "新手掠食者"
trait_scientist_novice_predator_desc: "§L这位科学家被认为是个弱小的掠食者，真奇怪他们能活这么久……§!\n"
trait_scientist_apprentice_predator: "学徒掠食者"
trait_scientist_apprentice_predator_desc: "§L这位领袖足够幸运，在最初几次遭遇渴望权力的掠食者时幸存了下来。§!\n"
trait_scientist_adept_predator: "娴熟掠食者"
trait_scientist_adept_predator_desc: "§L这位领袖比其物种中的普通掠食者更优秀。§!\n"
trait_scientist_expert_predator: "专家掠食者"
trait_scientist_expert_predator_desc: "§L与他人竞争职位的斗争给这位领袖留下了丰富的经验。§!\n"
trait_scientist_master_predator: "大师掠食者"
trait_scientist_master_predator_desc: "§L这位领袖是其物种中的巅峰个体，其技能也反映了这一点。§!\n"

#海军上将特质
trait_admiral_prey: "猎物"
trait_admiral_prey_desc: "§L在社会中更贪婪的成员看来，这位海军上将是个猎物，他们自己也心知肚明。这使得他们在行动中非常谨慎和有条理。§!\n"
trait_admiral_novice_predator: "新手掠食者"
trait_admiral_novice_predator_desc: "§L他们船上的船员正饥饿地看着他们……§!\n"
trait_admiral_apprentice_predator: "学徒掠食者"
trait_admiral_apprentice_predator_desc: "§L几次不幸的吞噬这位领袖的尝试，让他们对吞噬他人有了大致的了解。§!\n"
trait_admiral_adept_predator: "娴熟掠食者"
trait_admiral_adept_predator_desc: "§L这位领袖被认为是有能力的掠食者，因此攻击他们是有风险的。§!\n"
trait_admiral_expert_predator: "专家掠食者"
trait_admiral_expert_predator_desc: "§L这位掠食者在军中相当出名，经常品尝被击败星舰上的船员。§!\n"
trait_admiral_master_predator: "大师掠食者"
trait_admiral_master_predator_desc: "§L这位领袖令其猎物恐惧，并受到其士兵的尊敬。§!\n"

#将军特质
trait_general_novice_predator: "新手掠食者"
trait_general_novice_predator_desc: "§L这位领袖可能曾经见过有人被吃掉……？§!\n"
trait_general_apprentice_predator: "学徒掠食者"
trait_general_apprentice_predator_desc: "§L他们的士兵经常开玩笑说要吃掉他们的指挥官，至少他们可能是在开玩笑……§!\n"
trait_general_adept_predator: "娴熟掠食者"
trait_general_adept_predator_desc: "§L这位领袖在战场和食堂都吞下过几个敌人。§!\n"
trait_general_expert_predator: "专家掠食者"
trait_general_expert_predator_desc: "§L关于这位将军的传说早已传遍我们的边界之外，异星猎物们知道该害怕他们的到来。§!\n"
trait_general_master_predator: "大师掠食者"
trait_general_master_predator_desc: "§L这位将军在前线作战，以贪婪的饥饿吞噬敌人。§!\n"

