vore_leader_event.10.name: "日益增长的担忧"
vore_leader_event.10.desc: "§T看起来，最近我们的一位官员——确切地说是 §K[gorger_to_be.GetName]§!——[gorger_to_be.GetHasHave]最近声名鹊起。\n虽然对于我们帝国的许多公民来说，看到鼓胀的腹部时常因内部的挣扎而踢动是司空见惯的事，但 [gorger_to_be.GetName] 却将其提升到了一个新的高度，每天都有几名助手被吞噬。\n\n如果这种情况持续下去，我们担心这可能会对他们的健康——以及政府预算——产生负面影响。"
vore_leader_event.10.acknowledged: "§T明白了，监控事态发展。"
